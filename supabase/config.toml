[api]
port = 54321

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://app.getonetwo.com",
  "https://*.getonetwo.com",
  "http://localhost:5173"
]

[auth.email]
enable_signup = true
enable_confirmations = false


# Webhooks are authenticated by the function itself (Chargebee Basic auth,
# Stripe signature), not by a Supabase JWT. Deploying with JWT verification on
# makes the gateway reject every delivery with 401 before the function runs,
# and paid signups never get provisioned.
[functions.chargebee-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
