<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneTwo Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D1B2E; --brand-cyan: #A5F3FC; --brand-red: #D62839; --brand-teal: #155E75;
  --ink-50: #f8f9fa; --ink-100: #e9ecef; --ink-200: #dee2e6; --ink-300: #ced4da;
  --ink-400: #adb5bd; --ink-500: #6c757d; --ink-600: #495057; --ink-700: #343a40;
  --ink-800: #1a1f25; --ink-900: #0d1013;
  --sage-50: #f0f5f0; --sage-100: #d4e6d4; --sage-500: #4a7f4a; --sage-700: #2d5a2d;
  --accent-50: #fef2f2; --accent-100: #fee2e2; --accent-500: #e53e3e; --accent-700: #c53030;
  --amber-50: #fffbeb; --amber-100: #fef3c7; --amber-500: #f59e0b; --amber-700: #b45309;
  --mist-50: #f0f7fb; --mist-100: #d6eaf5; --mist-500: #3b8dba; --mist-700: #1a4158;
  --page-bg: #e4e6eb;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-display: 'DM Serif Display', Georgia, serif;
  --top-h: 58px; --bot-h: 60px; --rad: 12px; --rad-xl: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);background:var(--page-bg);color:var(--ink-800);line-height:1.5;min-height:100vh;padding-top:var(--top-h);font-weight:400;display:flex;flex-direction:column}
@media(max-width:639px){body{padding-bottom:var(--bot-h)}}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;line-height:1.2}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}

/* NAV */
.top-nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--top-h);background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.top-nav .logo span{color:#fff;font-family:var(--font-display);font-size:1.1rem}
.nav-links{display:flex;gap:0;align-items:center;height:100%}
.nav-link{color:rgba(255,255,255,.6);font-size:.875rem;font-weight:500;padding:0 16px;height:100%;display:flex;align-items:center;border-bottom:2px solid transparent;transition:all .2s;cursor:pointer}
.nav-link:hover{color:rgba(255,255,255,.85)}
.nav-link.active{color:#fff;border-bottom-color:var(--brand-cyan)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600}
.hamburger{display:none;color:#fff;font-size:1.5rem;padding:4px}
@media(max-width:639px){
  .nav-links{display:none}
  .hamburger{display:block}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:var(--top-h);left:0;right:0;background:var(--navy);padding:8px 0;z-index:99}
  .nav-links.open .nav-link{height:44px;padding:0 24px}
}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;height:var(--bot-h);background:var(--navy);justify-content:space-around;align-items:center;border-top:1px solid rgba(255,255,255,.1)}
@media(max-width:639px){.bottom-nav{display:flex}}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.4);font-size:.65rem;font-weight:500;padding:6px 8px;position:relative;transition:color .2s;cursor:pointer}
.bnav-item.active{color:var(--brand-cyan)}
.bnav-item.active::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--brand-cyan)}
.bnav-item svg{width:22px;height:22px;stroke-width:1.75}

#app{width:100%;max-width:1200px;margin:0 auto;padding:24px 32px;flex:1}

/* SHARED */
.page-header{background:linear-gradient(135deg,var(--navy) 0%,#162640 100%);border-radius:var(--rad-xl) var(--rad-xl) 0 0;padding:28px 24px 20px;color:#fff}
.page-header h1{font-size:1.6rem;margin-bottom:4px}
.page-header .sub{font-size:.85rem;opacity:.65;font-weight:300}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.kpi{background:rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.06)}
.kpi .lb{font-size:.7rem;opacity:.55;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .val{font-size:1.35rem;font-weight:700;margin-top:2px}
.kpi .sm{font-size:.7rem;opacity:.5;margin-top:2px}
.tab-bar{display:flex;border-bottom:1px solid var(--ink-200);background:#fff;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 16px;font-size:.82rem;font-weight:500;white-space:nowrap;color:var(--ink-400);border-bottom:2px solid transparent;transition:color .2s;cursor:pointer;flex-shrink:0;position:relative}
.tab-btn::after{content:'';position:absolute;bottom:-1px;left:50%;width:0;height:2px;background:var(--ink-900);transition:left .25s ease,width .25s ease}
.tab-btn:hover{color:var(--ink-600)}
.tab-btn.active{color:var(--ink-900);border-bottom-color:transparent}
.tab-btn.active::after{left:0;width:100%}
.content{background:#fff;border-radius:0 0 var(--rad-xl) var(--rad-xl);border:1px solid var(--ink-100);border-top:none;padding:20px;min-height:400px}
.card{background:#fff;border-radius:var(--rad);border:1px solid var(--ink-100);padding:16px;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card-flat{background:#fff;border-radius:var(--rad);border:1px solid var(--ink-100);padding:16px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pill-red{background:var(--accent-50);color:var(--accent-700)}
.pill-sage{background:var(--sage-50);color:var(--sage-700)}
.pill-amber{background:var(--amber-50);color:var(--amber-700)}
.pill-mist{background:var(--mist-50);color:var(--mist-700)}
.pill-ink{background:var(--ink-50);color:var(--ink-600)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;padding:0 6px;font-size:.7rem;font-weight:600}
.badge-red{background:var(--accent-500);color:#fff}
.badge-sage{background:var(--sage-500);color:#fff}
.badge-amber{background:var(--amber-500);color:#fff}
.pbar{height:6px;background:var(--ink-100);border-radius:3px;overflow:hidden}
.pbar .fill{height:100%;border-radius:3px;transition:width .4s ease}
.fill-sage{background:var(--sage-500)}.fill-red{background:var(--accent-500)}.fill-amber{background:var(--amber-500)}.fill-mist{background:var(--mist-500)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:600;transition:all .15s;cursor:pointer}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--brand-red);color:#fff}.btn-primary:hover{background:#b8212f}
.btn-outline{border:1px solid var(--ink-200);color:var(--ink-700);background:#fff}.btn-outline:hover{background:var(--ink-50)}
.btn-sm{padding:5px 12px;font-size:.75rem}
.btn-sage{background:var(--sage-500);color:#fff}.btn-sage:hover{background:var(--sage-700)}
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:var(--rad);font-size:.85rem}
.alert-red{background:var(--accent-50);border:1px solid var(--accent-100);color:var(--accent-700)}
.alert-amber{background:var(--amber-50);border:1px solid var(--amber-100);color:var(--amber-700)}
.alert-mist{background:var(--mist-50);border:1px solid var(--mist-100);color:var(--mist-700)}
.stitle{font-family:var(--font-display);font-size:1.05rem;margin-bottom:12px;color:var(--ink-800)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1024px){.grid-3{grid-template-columns:repeat(2,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.fb{display:flex;justify-content:space-between;align-items:center}
.fg{display:flex;gap:8px;align-items:center}
.mt-s{margin-top:8px}.mt-m{margin-top:16px}.mt-l{margin-top:24px}
.mb-s{margin-bottom:8px}.mb-m{margin-bottom:16px}
.ts{font-size:.82rem}.txs{font-size:.75rem}.tm{color:var(--ink-500)}.tb{font-weight:600}

/* ACTION ITEMS */
.ai-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--ink-100);border-radius:var(--rad);cursor:pointer;transition:all .15s}
.ai-row:hover{background:var(--ink-50);transform:translateX(2px)}
.ai-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ai-body{flex:1;min-width:0}
.ai-title{font-weight:600;font-size:.88rem}
.ai-meta{font-size:.75rem;color:var(--ink-500);margin-top:2px}

/* ACTIVITY */
.act-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ink-50)}
.act-item:last-child{border-bottom:none}
.act-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}

/* VOTE BAR */
.vote-bar{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:8px 0}
.vb-a{background:var(--sage-500);transition:width .5s ease}
.vb-d{background:var(--accent-500);transition:width .5s ease}
.vb-p{background:var(--ink-200);transition:width .5s ease}

/* LIFECYCLE */
.lc-track{display:flex;align-items:center;margin:12px 0}
.lc-s{font-size:.7rem;font-weight:600;padding:4px 10px;white-space:nowrap}
.lc-done{background:var(--sage-50);color:var(--sage-700)}
.lc-cur{background:var(--amber-50);color:var(--amber-700)}
.lc-fut{background:var(--ink-50);color:var(--ink-400)}
.lc-s:first-child{border-radius:6px 0 0 6px}.lc-s:last-child{border-radius:0 6px 6px 0}

/* WIZARD */
.wiz-ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.wiz-panel{background:#fff;border-radius:var(--rad-xl);width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.wiz-steps{display:flex;margin-bottom:24px}
.wz-s{flex:1;text-align:center;padding:8px 4px;font-size:.75rem;font-weight:600;color:var(--ink-400);border-bottom:2px solid var(--ink-200)}
.wz-s.active{color:var(--ink-900);border-bottom-color:var(--brand-red)}
.wz-s.done{color:var(--sage-500);border-bottom-color:var(--sage-500)}
.grp-card{border:2px solid var(--ink-100);border-radius:var(--rad);padding:18px;cursor:pointer;transition:all .15s}
.grp-card:hover{border-color:var(--brand-red);background:var(--accent-50)}
.grp-card.sel{border-color:var(--brand-red);background:var(--accent-50)}

/* CHECKLIST */
.cl-item{border:1px solid var(--ink-100);border-radius:var(--rad);margin-bottom:8px;overflow:hidden}
.cl-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s}
.cl-hdr:hover{background:var(--ink-50)}
.cl-body{display:none;padding:0 16px 16px}
.cl-body.open{display:block}
.earr{transition:transform .2s;font-size:.8rem;color:var(--ink-400)}
.earr.rot{transform:rotate(90deg)}
.why-p{background:var(--amber-50);border-radius:8px;padding:12px;margin-bottom:10px}
.if-p{background:var(--accent-50);border-radius:8px;padding:12px;margin-bottom:10px}
.how-p{background:var(--ink-50);border-radius:8px;padding:12px}
.sc{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.sc .cc{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-300);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;font-size:.7rem;color:transparent}
.sc .cc.chk{background:var(--sage-500);border-color:var(--sage-500);color:#fff}

/* WORKFLOW */
.wf-step{display:flex;gap:12px;padding:10px 0;position:relative}
.wf-step:not(:last-child)::after{content:'';position:absolute;left:15px;top:38px;bottom:-2px;width:2px;background:var(--ink-200)}
.wf-c{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink-300);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;z-index:1;background:#fff;cursor:pointer;transition:all .2s}
.wf-c.done{background:var(--sage-500);border-color:var(--sage-500);color:#fff}
.wf-c.act{border-color:var(--brand-red);color:var(--brand-red)}

/* COMMS */
.ch-tog{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--ink-200);border-radius:8px;cursor:pointer;transition:all .15s}
.ch-tog.on{border-color:var(--sage-500);background:var(--sage-50)}
.tog-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-300)}
.ch-tog.on .tog-dot{background:var(--sage-500);border-color:var(--sage-500)}
.tpl-cat{padding:10px 14px;border:1px solid var(--ink-100);border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:500;transition:all .15s}
.tpl-cat:hover{background:var(--ink-50)}
.tpl-cat.active{border-color:var(--brand-red);background:var(--accent-50);color:var(--accent-700)}

/* SUB-NAV, FILTERS */
.sub-nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.snb{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:500;background:var(--ink-50);color:var(--ink-600);transition:all .15s;cursor:pointer}
.snb:hover{background:var(--ink-100)}
.snb.active{background:var(--ink-800);color:#fff}
.fbar{display:flex;gap:6px;margin-bottom:16px}
.fbtn{padding:5px 12px;border-radius:6px;font-size:.75rem;font-weight:500;background:transparent;color:var(--ink-500);transition:all .15s;cursor:pointer}
.fbtn.active{background:var(--ink-800);color:#fff}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease-out}

/* HERO METRIC */
.hero-metric{text-align:center;padding:32px 16px}
.hero-metric .hero-label{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-400);font-weight:600;margin-bottom:6px}
.hero-metric .hero-value{font-size:3.2rem;font-family:var(--font-display);font-weight:400;line-height:1;color:var(--ink-900)}
.hero-metric .trend{display:inline-flex;align-items:center;gap:5px;font-size:.9rem;font-weight:600;margin-top:8px}
.hero-metric .trend.up{color:var(--sage-700)}
.hero-metric .trend.down{color:var(--accent-700)}
.hero-metric .trend .arrow{font-size:.7rem}

/* SCORE BANNER — the Robinhood "big number" moment */
.score-banner{background:linear-gradient(135deg,#0D1B2E 0%,#1a3a5c 50%,#155E75 100%);border-radius:var(--rad-xl);padding:36px 32px;text-align:center;color:#fff;position:relative;overflow:hidden}
.score-banner::before{content:'';position:absolute;top:-40%;right:-10%;width:300px;height:300px;border-radius:50%;background:rgba(165,243,252,.06)}
.score-banner::after{content:'';position:absolute;bottom:-30%;left:-5%;width:200px;height:200px;border-radius:50%;background:rgba(165,243,252,.04)}
.score-banner .score-label{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;opacity:.65;font-weight:500}
.score-banner .score-number{font-size:4rem;font-family:var(--font-display);line-height:1;margin:8px 0}
.score-banner .score-sub{font-size:1rem;opacity:.8;font-weight:300}
.score-banner .score-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);font-size:.82rem;font-weight:600;margin-top:12px}

/* STREAK / PROGRESS PILL */
.streak-row{display:flex;gap:6px;justify-content:center;margin-top:12px}
.streak-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;transition:all .3s}
.streak-dot.done{background:var(--sage-500);color:#fff}
.streak-dot.current{background:var(--amber-500);color:#fff;animation:pulse 2s ease-in-out infinite}
.streak-dot.pending{background:var(--ink-100);color:var(--ink-400)}

/* STAT CARD — colorful KPI card */
.stat-card{border-radius:var(--rad);padding:20px;text-align:center;transition:transform .2s,box-shadow .2s;cursor:pointer}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat-card .stat-val{font-size:1.8rem;font-family:var(--font-display);line-height:1}
.stat-card .stat-label{font-size:.75rem;margin-top:4px;opacity:.7;font-weight:500}

/* QUICK ACTION CARDS */
.quick-action{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px;border-radius:var(--rad);border:2px solid var(--ink-100);cursor:pointer;transition:all .2s ease;background:#fff;text-align:center}
.quick-action:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:var(--brand-red)}
.quick-action .qa-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.quick-action .qa-label{font-weight:700;font-size:.75rem}
.quick-action .qa-badge{font-size:.65rem;font-weight:600;padding:2px 6px;border-radius:10px;background:var(--accent-50);color:var(--accent-700)}

/* PAGE HEADER GRADE BOXES */
.ph-grade{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:8px;padding:4px 12px;font-size:.75rem;font-weight:600;color:#fff}
.ph-grades{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* METRIC CARD — compact KPI card matching live app */
.metric-card{background:#fff;border-radius:var(--rad);padding:16px;border:1px solid var(--ink-100);border-left:4px solid var(--ink-200);transition:transform .15s,box-shadow .15s;cursor:pointer}
.metric-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.metric-card .mc-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500);font-weight:600}
.metric-card .mc-value{font-size:1.25rem;font-weight:700;margin-top:2px;line-height:1.2}
.metric-card .mc-sub{font-size:.625rem;color:var(--ink-400);margin-top:2px;font-weight:500}

/* ATTENTION PILLS — horizontal scrollable row */
.attention-pills{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0;scrollbar-width:none}
.attention-pills::-webkit-scrollbar{display:none}
.attention-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;font-size:.85rem;font-weight:500;white-space:nowrap;flex-shrink:0;border:1px solid;cursor:pointer;transition:transform .15s}
.attention-pill:hover{transform:translateY(-1px)}
.attention-pill.ap-red{background:var(--accent-50);border-color:var(--accent-100);color:var(--accent-700)}
.attention-pill.ap-amber{background:var(--amber-50);border-color:var(--amber-100);color:var(--amber-700)}
.attention-pill.ap-sage{background:var(--sage-50);border-color:var(--sage-100);color:var(--sage-700)}
.attention-pill.ap-mist{background:var(--mist-50);border-color:var(--mist-100);color:var(--mist-700)}

/* PROGRESS SECTION — colored background grouping */
.progress-section{border-radius:var(--rad);padding:20px;border:1px solid}
.progress-section.ps-sage{background:var(--sage-50);border-color:var(--sage-100)}
.progress-section.ps-amber{background:var(--amber-50);border-color:var(--amber-100)}
.progress-section.ps-mist{background:var(--mist-50);border-color:var(--mist-100)}
.progress-section.ps-red{background:var(--accent-50);border-color:var(--accent-100)}

/* PROGRESS BAR LARGE */
.pbar-lg{height:12px;background:var(--ink-100);border-radius:6px;overflow:hidden;position:relative}
.pbar-lg .fill{height:100%;border-radius:6px;transition:width .6s ease}
.pbar-label{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;font-weight:600;margin-top:4px}

/* MICRO-INTERACTIONS */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes confettiBurst{0%{transform:translate(0,0) scale(1);opacity:1}100%{opacity:0}}
@keyframes fillBar{from{width:0}to{width:var(--fill-w,100%)}}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes radialFill{from{stroke-dashoffset:var(--circ,251)}to{stroke-dashoffset:var(--dash,0)}}

.stagger-in>*{opacity:0;animation:fadeSlideUp .35s ease-out forwards}
.stagger-in>*:nth-child(1){animation-delay:0ms}
.stagger-in>*:nth-child(2){animation-delay:50ms}
.stagger-in>*:nth-child(3){animation-delay:100ms}
.stagger-in>*:nth-child(4){animation-delay:150ms}
.stagger-in>*:nth-child(5){animation-delay:200ms}
.stagger-in>*:nth-child(6){animation-delay:250ms}
.stagger-in>*:nth-child(7){animation-delay:300ms}
.stagger-in>*:nth-child(8){animation-delay:350ms}
.stagger-in>*:nth-child(9){animation-delay:400ms}
.stagger-in>*:nth-child(10){animation-delay:450ms}

.shimmer{background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.4) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.pop-in{animation:popIn .4s ease-out forwards}

/* CONFETTI PARTICLE */
.confetti-particle{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:9999}

/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:8px;padding:8px 0}
.bar-chart .bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.bar-chart .bar{border-radius:4px 4px 0 0;min-width:20px;width:100%;transition:height .6s ease;animation:fillBar .8s ease-out}
.bar-chart .bar-label{font-size:.65rem;color:var(--ink-500);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-chart .bar-val{font-size:.65rem;font-weight:600}

/* RADIAL PROGRESS */
.radial-progress{position:relative;display:inline-flex;align-items:center;justify-content:center}
.radial-progress svg{transform:rotate(-90deg)}
.radial-progress .radial-track{fill:none;stroke:var(--ink-100);stroke-width:6}
.radial-progress .radial-fill{fill:none;stroke-width:6;stroke-linecap:round;animation:radialFill 1s ease-out forwards}
.radial-progress .radial-center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* DONUT CHART */
.donut-chart{position:relative;display:inline-flex;align-items:center;justify-content:center}
.donut-chart .donut-center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* SPARKLINE */
.sparkline{display:inline-block;vertical-align:middle}

/* WIZARD PROGRESS BAR */
.wiz-progress{height:4px;background:var(--ink-100);border-radius:2px;margin-bottom:20px;overflow:hidden}
.wiz-progress .wiz-fill{height:100%;background:var(--brand-red);border-radius:2px;transition:width .4s ease}

/* STEP CHECK ANIMATION */
.step-check{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--sage-500);color:#fff;font-size:.7rem}
.step-check.pop-in{animation:popIn .4s ease-out forwards}

@media(max-width:639px){
  .page-header{padding:20px 16px 16px}
  .page-header h1{font-size:1.3rem}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
  #app{padding:10px 10px 20px}
  .hero-metric .hero-value{font-size:1.8rem}
  .quick-action .qa-icon{width:36px;height:36px;font-size:1rem}
}

/* ===== CONSUMER-APP COMPONENTS ===== */

/* Hero Section (Robinhood-style big number) */
.hero {
  text-align: center; padding: 40px 20px 28px; background: #fff;
  border-radius: var(--rad-xl); margin-bottom: 12px;
}
.hero .hero-greeting {
  font-size: .85rem; color: var(--ink-400); font-weight: 500; margin-bottom: 4px;
}
.hero .hero-num {
  font-size: 3rem; font-family: var(--font-display); line-height: 1;
  color: var(--ink-900);
}
.hero .hero-sub {
  font-size: .88rem; margin-top: 8px; font-weight: 500;
}
.hero .hero-sub.good { color: var(--sage-700); }
.hero .hero-sub.warn { color: var(--amber-700); }
.hero .hero-sub.bad { color: var(--accent-700); }

/* Nudge Cards (Cleo-style smart prompts) */
.nudge {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; border-radius: var(--rad);
  background: #fff; border: 1px solid var(--ink-100);
  cursor: pointer; transition: transform .15s, box-shadow .15s;
  margin-bottom: 8px;
}
.nudge:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.06); }
.nudge:active { transform: scale(.98); }
.nudge .nudge-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
}
.nudge .nudge-body { flex: 1; min-width: 0; }
.nudge .nudge-title { font-weight: 600; font-size: .88rem; }
.nudge .nudge-meta { font-size: .75rem; color: var(--ink-400); margin-top: 2px; }
.nudge .nudge-arrow { color: var(--ink-300); font-size: 1.1rem; }
.nudge-urgent { border-left: 4px solid var(--accent-500); background: var(--accent-50); }
.nudge-warn { border-left: 4px solid var(--amber-500); background: var(--amber-50); }
.nudge-info { border-left: 4px solid var(--mist-500); }
.nudge-good { border-left: 4px solid var(--sage-500); background: var(--sage-50); }

/* Horizontal Scroll Row (Spotify-style) */
.hscroll-section { margin-bottom: 20px; }
.hscroll-header {
  font-size: .82rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink-500); margin-bottom: 10px;
  padding: 0 4px;
}
.hscroll-row {
  display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding: 2px 0 8px; scrollbar-width: none;
}
.hscroll-row::-webkit-scrollbar { display: none; }
.hscroll-card {
  flex-shrink: 0; width: 140px; padding: 16px 14px; border-radius: var(--rad);
  background: #fff; border: 1px solid var(--ink-100); text-align: center;
  cursor: pointer; transition: transform .15s;
}
.hscroll-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.06); }
.hscroll-card .hsc-val {
  font-size: 1.4rem; font-family: var(--font-display); line-height: 1;
}
.hscroll-card .hsc-label {
  font-size: .68rem; color: var(--ink-500); margin-top: 6px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em;
}

/* Feed Card (Venmo-style activity) */
.feed-card {
  background: #fff; border-radius: var(--rad); border: 1px solid var(--ink-100);
  padding: 16px; margin-bottom: 8px;
}
.feed-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--ink-50);
}
.feed-item:last-child { border-bottom: none; }
.feed-dot {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: .95rem; flex-shrink: 0;
}
.feed-body { flex: 1; min-width: 0; }
.feed-title { font-size: .85rem; font-weight: 600; }
.feed-meta { font-size: .72rem; color: var(--ink-400); margin-top: 1px; }
.feed-val { font-size: .85rem; font-weight: 700; white-space: nowrap; }

/* Big CTA Button (Venmo one-tap) */
.cta-big {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 16px; border-radius: var(--rad);
  font-size: 1rem; font-weight: 700; cursor: pointer;
  transition: transform .1s, box-shadow .15s;
  border: none;
}
.cta-big:active { transform: scale(.97); }
.cta-pay {
  background: var(--brand-red); color: #fff;
  box-shadow: 0 4px 16px rgba(214,40,57,.25);
}
.cta-pay:hover { box-shadow: 0 6px 20px rgba(214,40,57,.35); }
.cta-action {
  background: var(--navy); color: #fff;
  box-shadow: 0 4px 16px rgba(13,27,46,.2);
}

/* Celebration Banner (milestone moments) */
.celebration {
  text-align: center; padding: 20px; border-radius: var(--rad);
  background: linear-gradient(135deg, var(--sage-50), #e8f5e9);
  border: 1px solid var(--sage-100); margin-bottom: 12px;
}
.celebration .cel-emoji { font-size: 2rem; margin-bottom: 6px; }
.celebration .cel-title { font-size: 1rem; font-weight: 700; color: var(--sage-700); }
.celebration .cel-sub { font-size: .8rem; color: var(--ink-500); margin-top: 4px; }

/* Journey Track (gamified progress) */
.journey-track {
  display: flex; align-items: center; gap: 0;
  margin: 16px 0; padding: 0 12px;
}
.journey-node {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  flex-shrink: 0; position: relative;
}
.journey-dot {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 700; z-index: 1;
}
.journey-dot.done { background: var(--sage-500); color: #fff; }
.journey-dot.current { background: var(--amber-500); color: #fff; animation: pulse 2s infinite; }
.journey-dot.locked { background: var(--ink-100); color: var(--ink-400); }
.journey-label { font-size: .6rem; font-weight: 600; color: var(--ink-500); text-align: center; max-width: 60px; }
.journey-line { flex: 1; height: 3px; background: var(--ink-100); min-width: 16px; }
.journey-line.done { background: var(--sage-500); }

/* Section Heading */
.section-head {
  font-size: .82rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink-500); margin: 20px 0 10px; padding: 0 4px;
}

/* Consumer-App Responsive Layout */
.consumer-layout { display:grid; gap:20px; }
.consumer-layout .cl-full { grid-column: 1 / -1; }

@media(min-width:640px) {
  .consumer-layout { grid-template-columns: 1fr 1fr; }
  .hero .hero-num { font-size: 3.5rem; }
  .hero { padding: 48px 32px 32px; }
  .nudge { padding: 18px 20px; }
  .hscroll-row { flex-wrap: wrap; overflow-x: visible; }
  .hscroll-card { flex: 1; min-width: 100px; width: auto; }
}
@media(max-width:639px) {
  .consumer-layout { grid-template-columns: 1fr; }
  #app { padding: 12px 16px; }
  .hero .hero-num { font-size: 2.4rem; }
  .hero { padding: 28px 16px 20px; }
  .hscroll-card { width: 120px; padding: 12px 10px; }
}
</style>

/* ===== DELIGHT UTILITIES ===== */
function fireConfetti(targetEl){
  const rect=targetEl?targetEl.getBoundingClientRect():{left:window.innerWidth/2,top:window.innerHeight/2};
  const colors=['#D62839','#A5F3FC','#4a7f4a','#f59e0b','#3b8dba','#e53e3e','#155E75'];
  const count=35;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='confetti-particle';
    p.style.left=rect.left+'px';
    p.style.top=rect.top+'px';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=(4+Math.random()*6)+'px';
    p.style.height=(4+Math.random()*6)+'px';
    p.style.borderRadius=Math.random()>0.5?'50%':'2px';
    const angle=Math.random()*Math.PI*2;
    const velocity=80+Math.random()*120;
    const dx=Math.cos(angle)*velocity;
    const dy=Math.sin(angle)*velocity-60;
    p.style.transition='all .8s cubic-bezier(.25,.46,.45,.94)';
    document.body.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.random()*360}deg)`;
      p.style.opacity='0';
    });
    setTimeout(()=>p.remove(),900);
  }
}
function countUp(el,target,duration=1200){
  if(!el)return;
  const isPercent=typeof target==='string'&&target.includes('%');
  const isCurrency=typeof target==='string'&&target.includes('$');
  let num=parseFloat(String(target).replace(/[$,%,]/g,''));
  if(isNaN(num))return;
  const start=performance.now();
  const fmt=v=>{
    if(isCurrency)return '$'+v.toLocaleString(undefined,{maximumFractionDigits:0});
    if(isPercent)return Math.round(v)+'%';
    return v.toLocaleString(undefined,{maximumFractionDigits:0});
  };
  el.textContent=fmt(0);
  function tick(now){
    const elapsed=now-start;
    const progress=Math.min(elapsed/duration,1);
    const ease=1-Math.pow(1-progress,3);
    el.textContent=fmt(num*ease);
    if(progress<1)requestAnimationFrame(tick);
    else el.textContent=fmt(num);
  }
  requestAnimationFrame(tick);
}
function renderDonut(segments,size=120){
  const total=segments.reduce((s,seg)=>s+seg.value,0);
  if(!total)return '';
  let cumAngle=0;
  const gradParts=segments.map(seg=>{
    const startDeg=cumAngle;
    cumAngle+=(seg.value/total)*360;
    return `${seg.color} ${startDeg}deg ${cumAngle}deg`;
  });
  const r=size/2;
  return `<div class="donut-chart" style="width:${size}px;height:${size}px">
    <div style="width:100%;height:100%;border-radius:50%;background:conic-gradient(${gradParts.join(',')})"></div>
    <div style="position:absolute;width:${size*0.6}px;height:${size*0.6}px;border-radius:50%;background:#fff"></div>
    <div class="donut-center"><div style="font-weight:700;font-size:${size>100?'1rem':'.8rem'}">${segments[0]?segments[0].label:''}</div></div>
  </div>`;
}
function renderRadial(percent,size=80,color='var(--sage-500)',label){
  const r=(size-8)/2;
  const circ=2*Math.PI*r;
  const dash=circ-(percent/100)*circ;
  return `<div class="radial-progress" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="radial-track" cx="${size/2}" cy="${size/2}" r="${r}"/>
      <circle class="radial-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" style="stroke-dasharray:${circ};stroke-dashoffset:${dash};--circ:${circ};--dash:${dash}"/>
    </svg>
    <div class="radial-center"><div style="font-weight:700;font-size:${size>60?'1rem':'.75rem'}">${label!==undefined?label:percent+'%'}</div></div>
  </div>`;

function renderSparkline(points,w=100,h=30,color='var(--sage-500)'){
  if(!points||!points.length)return '';
  const max=Math.max(...points);
  const min=Math.min(...points);
  const range=max-min||1;
  const step=w/(points.length-1);
  const pts=points.map((v,i)=>`${i*step},${h-((v-min)/range)*h*0.8-h*0.1}`).join(' ');
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function renderBarChart(items,maxH=120){
  const maxVal=Math.max(...items.map(i=>Math.max(i.value,i.value2||0)));
  if(!maxVal)return '';
  let h='<div class="bar-chart" style="height:'+maxH+'px;align-items:flex-end">';
  items.forEach(item=>{
    const h1=Math.max(4,(item.value/maxVal)*maxH*0.85);
    const color=item.color||'var(--sage-500)';
    h+=`<div class="bar-col"><div class="bar-val">${item.valLabel||''}</div><div class="bar" style="height:${h1}px;background:${color};--fill-w:100%"></div><div class="bar-label">${item.label||''}</div></div>`;
    if(item.value2!==undefined){
      const h2=Math.max(4,(item.value2/maxVal)*maxH*0.85);
      // handled via paired bars - skip for simplicity
    }
  });
  h+='</div>';
  return h;
}
function getTimeGreeting(){
  const h=new Date().getHours();

function postRenderEffects(){

}

function rChecklist(){
  const doneCount=D.checklist.filter(c=>c.status==='done').length;
  const totalCount=D.checklist.length;
  const clPct=Math.round(doneCount/totalCount*100);
  const grade=clPct>=90?'A':clPct>=80?'B+':clPct>=70?'B':clPct>=60?'C':'D';
  const gradeColor=clPct>=80?'var(--sage-700)':clPct>=60?'var(--amber-700)':'var(--accent-700)';
  const gradeFill=clPct>=80?'var(--sage-500)':clPct>=60?'var(--amber-500)':'var(--accent-500)';
  const cats={};
  D.checklist.forEach(c=>{if(!cats[c.category])cats[c.category]={done:0,total:0};cats[c.category].total++;if(c.status==='done')cats[c.category].done++;});
  const nextGrade=clPct>=90?null:clPct>=80?{grade:'A',need:Math.ceil(totalCount*0.9)-doneCount}:clPct>=70?{grade:'B+',need:Math.ceil(totalCount*0.8)-doneCount}:clPct>=60?{grade:'B',need:Math.ceil(totalCount*0.7)-doneCount}:{grade:'C',need:Math.ceil(totalCount*0.6)-doneCount};

  // Consumer layout wrapper
  const catNames=Object.keys(cats);
  const overdueFilings=D.filings.filter(f=>f.status==='overdue');
  let items=S.clFilter==='overdue'?[...D.checklist].sort((a,b)=>(a.status==='overdue'?0:1)-(b.status==='overdue'?0:1)):
    S.clFilter==='category'?[...D.checklist].sort((a,b)=>a.category.localeCompare(b.category)):D.checklist;

  let h=`<div class="consumer-layout">`;

  // cl-full: Hero + journey track + milestone nudge
  h+=`<div class="cl-full">
    <div class="hero" style="border-radius:var(--rad-xl);margin-bottom:12px">
      <div class="hero-greeting">Compliance Score</div>
      <div class="hero-num" style="color:${gradeColor}" data-countup="${clPct}%">${clPct}%</div>
      <div class="hero-sub ${clPct>=80?'good':clPct>=60?'warn':'bad'}">Grade ${grade} &middot; ${doneCount} of ${totalCount} complete</div>
    </div>
    <div class="journey-track">`;
  catNames.forEach((cat,i)=>{
    const v=cats[cat];
    const catDone=v.done===v.total;
    const catCurrent=!catDone&&v.done>0;
    const dotCls=catDone?'done':catCurrent?'current':'locked';
    h+=`<div class="journey-node"><div class="journey-dot ${dotCls}">${catDone?'&#10003;':catCurrent?v.done:'&#128274;'}</div><div class="journey-label">${cat}</div></div>`;
    if(i<catNames.length-1){
      h+=`<div class="journey-line${catDone?' done':''}"></div>`;
    }
  });
  h+=`</div>`;
  if(nextGrade){
    h+=`<div class="nudge nudge-warn">
      <div class="nudge-icon" style="background:var(--amber-50)">&#127942;</div>
      <div class="nudge-body"><div class="nudge-title">Complete ${nextGrade.need} more item${nextGrade.need>1?'s':''} to reach Grade ${nextGrade.grade}</div><div class="nudge-meta">You're almost there!</div></div>
    </div>`;
  } else {
    h+=`<div class="celebration"><div class="cel-emoji">&#127942;</div><div class="cel-title">Grade ${grade} achieved!</div><div class="cel-sub">Full compliance — outstanding work</div></div>`;
  }
  h+=`</div>`;

  // cl-primary: Filter bar + filings
  h+=`<div class="cl-primary">`;
  h+=`<div class="fb mb-m">
    <div class="fbar" style="margin-bottom:0"><div class="fbtn${S.clFilter==='all'?' active':''}" data-action="cl-filter" data-filter="all">All</div><div class="fbtn${S.clFilter==='overdue'?' active':''}" data-action="cl-filter" data-filter="overdue">Overdue First</div><div class="fbtn${S.clFilter==='category'?' active':''}" data-action="cl-filter" data-filter="category">By Category</div></div>
  </div>`;
  if(overdueFilings.length){
    h+=`<div class="nudge nudge-urgent" style="margin-bottom:12px">
      <div class="nudge-icon" style="background:var(--accent-50)">&#9888;</div>
      <div class="nudge-body"><div class="nudge-title">${overdueFilings.length} filing${overdueFilings.length>1?'s are':' is'} overdue</div><div class="nudge-meta">${overdueFilings.map(f=>f.name).join(', ')}</div></div>
    </div>`;
  }
  h+=`<div class="section-head">Regulatory Filings</div><div class="mb-m">`;
  h+=D.filings.map(f=>{
    const stCls=f.status==='overdue'?'pill-red':f.status==='filed'?'pill-sage':'pill-amber';
    return `<div class="card-flat mb-s"><div class="fb"><div><div class="ts tb">${f.name}</div><div class="txs tm">${f.category} &middot; Due: ${f.dueDate} &middot; Responsible: ${f.responsible}</div></div><div class="fg"><span class="pill ${stCls}">${f.status}</span>${f.status!=='filed'?`<button class="btn btn-sm btn-outline" data-action="file-filing" data-id="${f.id}">Mark Filed</button>`:''}</div></div></div>`;
  }).join('');
  h+=`</div></div>`;

  // cl-secondary: Checklist items
  h+=`<div class="cl-secondary">`;
  h+=`<div class="section-head">Compliance Checklist</div>`;
  h+=items.map(c=>{
    const open=S.expanded.has(c.id);
    const stCls={done:'pill-sage',overdue:'pill-red',upcoming:'pill-amber'}[c.status];
    return `<div class="cl-item">
      <div class="cl-hdr" data-action="expand" data-id="${c.id}">
        <span class="earr${open?' rot':''}" data-action="expand" data-id="${c.id}">&#9654;</span>
        <span class="pill ${stCls}">${c.status}</span>
        <span class="ts tb" style="flex:1">${c.title}</span>
        <span class="txs tm">${c.category}</span>
      </div>
      <div class="cl-body${open?' open':''}">
        <div class="why-p"><div class="txs tb" style="color:var(--amber-700)">Why This Matters</div><div class="txs mt-s">${c.why}</div></div>
        <div class="if-p"><div class="txs tb" style="color:var(--accent-700)">If Not Completed</div><div class="txs mt-s">${c.ifNot}</div></div>
        <div class="how-p"><div class="txs tb mb-s">How To Complete</div>
          ${c.steps.map((st,i)=>{
            const sid=c.id+'-s'+i;
            const chk=S.checkedSteps.has(sid);
            return `<div class="sc"><div class="cc${chk?' chk':''}" data-action="check-cl-step" data-id="${sid}">${chk?'&#10003;':''}</div><div class="txs">${i+1}. ${st}</div></div>`;
          }).join('')}
        </div>
        <div class="txs tm mt-s" style="font-style:italic">Legal citation: ${c.citation}</div>
        <div class="fg mt-s"><button class="btn btn-sm btn-outline">Attach Document</button><button class="btn btn-sm btn-outline">Notify Board</button><button class="btn btn-sm btn-outline">Add to Meeting</button></div>
      </div>
    </div>`;
  }).join('');
  h+=`</div>`;

  h+=`</div>`; // close consumer-layout
  return h;
}
function rMeetings(){
  if(S.meetingDetail)return rMeetingDetail();
  let h=`<div class="fb mb-m"><span class="tb">Meetings</span><button class="btn btn-primary btn-sm" data-action="show-modal" data-modal="create-meeting">+ Schedule Meeting</button></div>`;
  h+=`<div class="stagger-in">${D.meetings.map(m=>{
    const stCls=m.status==='Upcoming'?'pill-sage':m.status==='Scheduled'?'pill-mist':'pill-amber';
    const md=D.meetingDetails[m.id];
    const boardAttendees=md?md.attendees.board.length:0;
    const boardTotal=D.boardMembers.length;
    const attendPct=Math.round(boardAttendees/boardTotal*100);
    return `<div class="card mb-s" style="cursor:pointer" data-action="open-meeting" data-id="${m.id}">
      <div class="fg"><div style="width:50px;height:56px;border-radius:8px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:.65rem;text-transform:uppercase">${m.date.split(' ')[0]}</div><div style="font-size:1.2rem;font-weight:700">${m.date.split(' ')[1]}</div></div>
      <div style="flex:1"><div class="tb">${m.title}</div><div class="txs tm">${m.time} &middot; ${m.location}</div></div>
      ${md?renderRadial(attendPct,40,attendPct>=60?'var(--sage-500)':'var(--amber-500)'):''}
      <span class="pill ${stCls}">${m.status}</span><span style="color:var(--ink-300)">&rsaquo;</span></div>
    </div>`;
  }).join('')}</div>`;
  h+=`<div class="card-flat mt-m"><div class="fb"><div><div class="txs tb">Meeting Cadence</div><div class="txs tm">Board meetings: Monthly &middot; Annual meeting: November</div></div></div></div>`;
  return h;
}
function rMeetingDetail(){
  const m=D.meetings.find(x=>x.id===S.meetingDetail);
  const md=D.meetingDetails[S.meetingDetail];
  if(!m||!md){S.meetingDetail=null;return rMeetings();}
  let h=`<button class="btn btn-outline btn-sm mb-m" data-action="back-from-meeting">&larr; Back to Meetings</button>`;
  h+=`<div class="fb mb-m"><div><div class="tb" style="font-size:1.2rem">${m.title}</div><div class="txs tm">${m.date} &middot; ${m.time} &middot; ${m.location}</div></div><span class="pill ${m.status==='Upcoming'?'pill-sage':'pill-amber'}">${m.status}</span></div>`;
  // Agenda
  h+=`<div class="stitle">Agenda</div><div class="mb-m">${md.agenda.map((a,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--ink-50)"><span class="txs tm" style="margin-right:8px">${i+1}.</span><span class="ts">${a}</span></div>`).join('')}</div>`;
  // Attendance
  h+=`<div class="stitle">Attendance</div><div class="grid-2 mb-m">
    <div class="card-flat"><div class="txs tb mb-s">Board Members</div>${md.attendees.board.map(b=>`<div class="txs" style="padding:2px 0">&#10003; ${b}</div>`).join('')}</div>
    <div class="card-flat"><div class="txs tb mb-s">Owners & Guests</div>${md.attendees.owners.concat(md.attendees.guests).map(o=>`<div class="txs" style="padding:2px 0">&#10003; ${o}</div>`).join('')}${!md.attendees.owners.length&&!md.attendees.guests.length?'<div class="txs tm">None recorded</div>':''}</div>
  </div>`;
  // Minutes
  h+=`<div class="stitle">Minutes</div><div class="card-flat mb-m">${md.minutes?`<div class="ts">${md.minutes}</div>`:'<textarea rows="4" placeholder="Record meeting minutes..." style="width:100%;padding:8px;border:1px solid var(--ink-200);border-radius:6px"></textarea><button class="btn btn-sm btn-outline mt-s">Save Minutes</button>'}</div>`;
  // Minutes approval
  if(md.minutes){
    const approved=md.minutesApprovals.filter(a=>a.approved).length;
    const total=md.minutesApprovals.length;
    const approvePct=Math.round(approved/total*100);
    h+=`<div class="stitle">Minutes Approval</div><div class="mb-m">`;
    h+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      ${renderRadial(approvePct,50,approvePct>=100?'var(--sage-500)':'var(--amber-500)')}
      <div><div class="txs tb">${approved} of ${total} board members approved</div><div class="txs tm">${approvePct>=100?'All approvals received':'Awaiting remaining approvals'}</div></div>
    </div>`;
    h+=md.minutesApprovals.map(a=>`<div class="fb" style="padding:6px 0;border-bottom:1px solid var(--ink-50)"><div class="fg"><span class="ts">${a.member}</span></div>${a.approved?'<span class="pill pill-sage">&#10003; Approved</span>':'<button class="btn btn-sm btn-outline" data-action="approve-minutes" data-member="'+a.member+'">Approve</button>'}</div>`).join('');
    h+=`</div>`;
  }
  // Votes recorded
  if(md.votes.length){
    h+=`<div class="stitle">Votes Recorded</div>`;
    h+=md.votes.map(v=>`<div class="card-flat mb-s"><div class="fb"><div class="tb">${v.motion}</div><span class="pill ${v.result==='Passed'?'pill-sage':'pill-red'}">${v.result}</span></div><div class="txs tm mt-s">Yes: ${v.yes} &middot; No: ${v.no} &middot; Abstain: ${v.abstain}</div></div>`).join('');
  }
  h+=`<div class="fg mt-m"><button class="btn btn-sm btn-outline" data-action="show-modal" data-modal="record-meeting-vote">Vote on This</button><button class="btn btn-sm btn-outline">Edit Meeting</button><button class="btn btn-sm btn-outline" style="color:var(--accent-700)">Cancel Meeting</button></div>`;
  return h;
}
function rVotes(){
  if(S.electionDetail)return rElectionDetail();
  let h=`<div class="fb mb-m"><span class="tb">Elections & Votes</span><button class="btn btn-primary btn-sm" data-action="show-modal" data-modal="create-election">+ Create Election</button></div>`;
  h+=`<div class="stagger-in">${D.elections.map(e=>{
    const stCls=e.status==='open'?'pill-amber':e.status==='closed'?'pill-mist':e.status==='certified'?'pill-sage':'pill-ink';
    const partColor=e.participation>=e.quorumReq?'var(--sage-500)':'var(--amber-500)';
    return `<div class="card mb-s" style="cursor:pointer" data-action="open-election" data-id="${e.id}">
      <div style="display:flex;gap:14px;align-items:center">
        ${renderRadial(e.participation,56,partColor)}
        <div style="flex:1">
          <div class="fg"><span class="pill pill-mist">${e.type.replace(/_/g,' ')}</span><span class="pill ${stCls}">${e.status}</span></div>
          <div class="tb mt-s">${e.title}</div>
          <div class="txs tm">${e.description}</div>
          <div class="fg mt-s"><span class="txs">${e.ballotItems.length} ballot item(s)</span><span class="txs tm">&middot; Closes: ${e.scheduledClose}</span></div>
        </div>
        <span style="color:var(--ink-300)">&rsaquo;</span>
      </div>
    </div>`;
  }).join('')}</div>`;
  // Legacy votes
  h+=`<div class="stitle mt-m">Other Board Votes</div>`;
  h+=D.votes.map(v=>{
    const total=v.yes+v.no+v.abstain;
    const stCls=v.status==='Passed'?'pill-sage':v.status==='Open'?'pill-amber':'pill-mist';
    return `<div class="card-flat mb-s">
      <div class="fb"><span class="tb">${v.title}</span><span class="pill ${stCls}">${v.status}</span></div>
      <div class="txs tm mt-s">Type: ${v.type}${v.deadline?' &middot; Deadline: '+v.deadline:''}</div>
      ${total>0?`<div class="vote-bar mt-s"><div class="vb-a" style="width:${total?v.yes/total*100:0}%"></div><div class="vb-d" style="width:${total?v.no/total*100:0}%"></div><div class="vb-p" style="width:${total?v.abstain/total*100:0}%"></div></div>
      <div class="fb txs"><span style="color:var(--sage-700)">${v.yes} Yes</span><span style="color:var(--accent-700)">${v.no} No</span><span class="tm">${v.abstain} Abstain</span></div>`:'<div class="txs tm mt-s">No votes cast yet</div>'}
    </div>`;
  }).join('');
  return h;
}
function rElectionDetail(){
  const e=D.elections.find(x=>x.id===S.electionDetail);
  if(!e){S.electionDetail=null;return rVotes();}
  let h=`<button class="btn btn-outline btn-sm mb-m" data-action="back-from-election">&larr; Back to Elections</button>`;
  const stCls=e.status==='open'?'pill-amber':e.status==='closed'?'pill-mist':e.status==='certified'?'pill-sage':'pill-ink';
  h+=`<div class="fb mb-m"><div><div class="tb" style="font-size:1.2rem">${e.title}</div><div class="txs tm">${e.type.replace(/_/g,' ')} &middot; Closes: ${e.scheduledClose}</div></div><span class="pill ${stCls}">${e.status}</span></div>`;
  h+=`<div class="txs mb-m">${e.description}</div>`;
  // Participation with radial progress
  const partColor=e.participation>=e.quorumReq?'var(--sage-500)':'var(--amber-500)';
  h+=`<div class="card-flat mb-m" style="background:var(--mist-50);display:flex;align-items:center;gap:16px">
    ${renderRadial(e.participation,80,partColor)}
    <div style="flex:1"><div class="tb">Participation: ${e.participation}%</div><div class="txs tm">Quorum required: ${e.quorumReq}%</div><span class="pill ${e.participation>=e.quorumReq?'pill-sage':'pill-amber'} mt-s">${e.participation>=e.quorumReq?'Quorum Met':'Below Quorum'}</span></div>
  </div>`;
  // Ballot items
  h+=`<div class="fb mb-s"><span class="stitle" style="margin-bottom:0">Ballot Items</span>${e.status==='draft'?'<button class="btn btn-sm btn-outline" data-action="show-modal" data-modal="add-ballot-item">+ Add Item</button>':''}</div>`;
  h+=e.ballotItems.map(bi=>{
    const totalVotes=bi.votes.reduce((s,v)=>s+v,0);
    return `<div class="card-flat mb-s">
      <div class="fb"><span class="tb">${bi.title}</span><span class="pill pill-ink">${bi.type.replace(/_/g,' ')}</span></div>
      ${totalVotes>0?`<div class="mt-s">${bi.candidates.map((c,i)=>{
        const pct=totalVotes?Math.round(bi.votes[i]/totalVotes*100):0;
        return `<div class="fb txs" style="padding:4px 0"><span>${c}</span><div class="fg"><div class="pbar" style="width:100px"><div class="fill fill-sage" style="width:${pct}%"></div></div><span class="tb">${bi.votes[i]} (${pct}%)</span></div></div>`;
      }).join('')}</div>`:'<div class="txs tm mt-s">No votes cast yet</div>'}
    </div>`;
  }).join('');
  // Compliance checks
  h+=`<div class="stitle mt-m">Compliance Checks</div>`;
  h+=e.complianceChecks.map(c=>`<div class="fb" style="padding:6px 0;border-bottom:1px solid var(--ink-50)"><span class="ts">${c.label}</span><span class="pill ${c.met?'pill-sage':'pill-red'}">${c.met?'Met':'Not Met'}</span>${c.detail?`<span class="txs tm" style="margin-left:8px">${c.detail}</span>`:''}</div>`).join('');
  // Lifecycle actions
  h+=`<div class="fg mt-m">
    ${e.status==='draft'?'<button class="btn btn-sage btn-sm" data-action="election-action" data-id="'+e.id+'" data-act="open">Open Voting</button>':''}
    ${e.status==='open'?'<button class="btn btn-sm btn-outline" data-action="election-action" data-id="'+e.id+'" data-act="close">Close Voting</button>':''}
    ${e.status==='closed'?'<button class="btn btn-sage btn-sm" data-action="election-action" data-id="'+e.id+'" data-act="certify">Certify Results</button>':''}
  </div>`;
  return h;
}

/* ===== EVENT DELEGATION ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action;
  if(action==='nav'){
    const view=el.dataset.view;
    const tab=el.dataset.tab;
    navigate(view,tab);
    const nl=document.getElementById('navLinks');
    if(nl)nl.classList.remove('open');
  }
  else if(action==='tab'){S.tabs[el.dataset.view]=el.dataset.tab;render();}
  else if(action==='toggle-menu'){document.getElementById('navLinks').classList.toggle('open');}
  else if(action==='expand'){
    const id=el.dataset.id;
    S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id);
    render();
  }
  else if(action==='check-step'){
    const id=el.dataset.id;
    const wasChecked=S.checked.has(id);
    wasChecked?S.checked.delete(id):S.checked.add(id);
    render();
    // Check if all case steps are done
    if(!wasChecked&&S.caseDetail){
      const allDone=S.caseDetail.phases.every(p=>p.steps.every(s=>S.checked.has(s.id)));
      if(allDone)setTimeout(()=>fireConfetti(el),200);
    }
  }
  else if(action==='close-case'){
    fireConfetti(el);
    S.caseDetail=null;
    render();
  }
  else if(action==='check-cl-step'){
    const id=el.dataset.id;
    const wasChecked=S.checkedSteps.has(id);
    wasChecked?S.checkedSteps.delete(id):S.checkedSteps.add(id);
    render();
    // Check if checklist item is now 100% complete - fire confetti
    if(!wasChecked){
      const itemId=id.split('-s')[0];
      const item=D.checklist.find(c=>c.id===itemId);
      if(item){
        const allDone=item.steps.every((_,i)=>S.checkedSteps.has(itemId+'-s'+i));
        if(allDone)fireConfetti(el);
      }
      // Check if ALL checklist items are done
      const totalDone=D.checklist.filter(c=>c.status==='done').length;
      const stepsAllDone=D.checklist.every(c=>c.steps.every((_,i)=>S.checkedSteps.has(c.id+'-s'+i))||c.status==='done');
      if(stepsAllDone&&totalDone>0)fireConfetti(el);
    }
  }
  else if(action==='vote'){
    S.spendingVotes[el.dataset.id]=el.dataset.choice;
    render();
  }
  else if(action==='spending-sub'){S.spendingSub=el.dataset.sub;render();}
  else if(action==='ledger-sub'){S.ledgerSub=el.dataset.sub;render();}
  else if(action==='open-unit'){S.unitDetail=el.dataset.unit;render();window.scrollTo(0,0);}
  else if(action==='back-from-unit'){S.unitDetail=null;render();}
  else if(action==='advance-wo'){
    const wo=D.workOrders.find(w=>w.id===el.dataset.id);
    if(wo&&wo.currentStep<wo.lifecycle.length-1){
      wo.currentStep++;
      wo.status=['draft','approved','invoiced','paid','gl_posted'][wo.currentStep];
      if(wo.status==='paid')setTimeout(()=>fireConfetti(el),200);
    }
    render();
  }
  else if(action==='send-invoice'){const inv=D.unitInvoices.find(i=>i.id===el.dataset.id);if(inv)inv.status='sent';render();}
  else if(action==='pay-invoice'){const inv=D.unitInvoices.find(i=>i.id===el.dataset.id);if(inv){inv.status='paid';setTimeout(()=>fireConfetti(el),200);}render();}
  else if(action==='show-report'){
    const rpt=el.dataset.report;
    let body='';
    if(rpt==='income'){
      const income=D.chartOfAccounts.filter(a=>a.type==='Income');
      const expenses=D.chartOfAccounts.filter(a=>a.type==='Expense');
      const totalInc=income.reduce((s,a)=>s+a.balance,0);
      const totalExp=expenses.reduce((s,a)=>s+a.balance,0);
      body=`<h3 class="mb-m">Income Statement (YTD)</h3>
        <div class="tb mb-s">Revenue</div>${income.map(a=>`<div class="fb txs" style="padding:4px 0"><span>${a.name}</span><span>$${a.balance.toLocaleString()}</span></div>`).join('')}
        <div class="fb tb mt-s" style="border-top:1px solid var(--ink-200);padding-top:8px"><span>Total Revenue</span><span style="color:var(--sage-700)">$${totalInc.toLocaleString()}</span></div>
        <div class="tb mb-s mt-m">Expenses</div>${expenses.map(a=>`<div class="fb txs" style="padding:4px 0"><span>${a.name}</span><span>$${a.balance.toLocaleString()}</span></div>`).join('')}
        <div class="fb tb mt-s" style="border-top:1px solid var(--ink-200);padding-top:8px"><span>Total Expenses</span><span style="color:var(--accent-700)">$${totalExp.toLocaleString()}</span></div>
        <div class="fb tb mt-m" style="border-top:2px solid var(--ink-300);padding-top:8px;font-size:1.1rem"><span>Net Income</span><span style="color:${totalInc-totalExp>=0?'var(--sage-700)':'var(--accent-700)'}">$${(totalInc-totalExp).toLocaleString()}</span></div>`;
    } else if(rpt==='balance'){
      const assets=D.chartOfAccounts.filter(a=>a.type==='Asset');
      const liabs=D.chartOfAccounts.filter(a=>a.type==='Liability');
      const equity=D.chartOfAccounts.filter(a=>a.type==='Equity');

        <div class="tb mb-s">Assets</div>${assets.map(a=>`<div class="fb txs" style="padding:4px 0"><span>${a.name}</span><span>$${a.balance.toLocaleString()}</span></div>`).join('')}
        <div class="fb tb mt-s" style="border-top:1px solid var(--ink-200);padding-top:8px"><span>Total Assets</span><span>$${assets.reduce((s,a)=>s+a.balance,0).toLocaleString()}</span></div>
        <div class="tb mb-s mt-m">Liabilities</div>${liabs.map(a=>`<div class="fb txs" style="padding:4px 0"><span>${a.name}</span><span>$${a.balance.toLocaleString()}</span></div>`).join('')}

        <div class="tb mb-s mt-m">Equity</div>${equity.map(a=>`<div class="fb txs" style="padding:4px 0"><span>${a.name}</span><span>$${a.balance.toLocaleString()}</span></div>`).join('')}`;
    } else {
      const aging=[{label:'Current (< 30 days)',units:D.delinquents.filter(d=>d.days<30)},{label:'30-59 Days',units:D.delinquents.filter(d=>d.days>=30&&d.days<60)},{label:'60-89 Days',units:D.delinquents.filter(d=>d.days>=60&&d.days<90)},{label:'90+ Days',units:D.delinquents.filter(d=>d.days>=90)}];
      body=`<h3 class="mb-m">Delinquency Report</h3>${aging.map(a=>`<div class="mb-m"><div class="tb">${a.label}</div>${a.units.length?a.units.map(u=>`<div class="fb txs" style="padding:4px 0"><span>Unit ${u.unit} - ${u.name}</span><span class="tb">${u.owed} (${u.days} days)</span></div>`).join(''):'<div class="txs tm">None</div>'}</div>`).join('')}

    }
    $('wizard').innerHTML=`<div class="wiz-ov" data-action="close-modal"><div class="wiz-panel" onclick="event.stopPropagation()"><div class="fb mb-m"><div></div><button data-action="close-modal" style="font-size:1.2rem;color:var(--ink-400)">&times;</button></div>${body}</div></div>`;
  }
  else if(action==='show-modal'){
    const modal=el.dataset.modal;
    let body='';
    if(modal==='create-wo'){
      body=`<h3 class="mb-m">Create Work Order</h3><div style="display:flex;flex-direction:column;gap:12px">

    if(f)f.status='filed';
    render();
  }
  else if(action==='approve-minutes'){
    const md=D.meetingDetails[S.meetingDetail];
    if(md){
      const a=md.minutesApprovals.find(x=>x.member===el.dataset.member);
      if(a)a.approved=true;
      const allApproved=md.minutesApprovals.every(x=>x.approved);
      if(allApproved)setTimeout(()=>fireConfetti(el),200);
    }
    render();
  }
  else if(action==='case-filter'){S.caseFilter=el.dataset.filter;render();}
  else if(action==='cl-filter'){S.clFilter=el.dataset.filter;render();}
  else if(action==='open-case'){
    S.caseDetail=D.caseDetail;
    render();
    window.scrollTo(0,0);
  }
  else if(action==='back-to-cases'){S.caseDetail=null;render();}
  else if(action==='demo-pay'){
    $('wizard').innerHTML=`<div class="wiz-ov" data-action="close-modal"><div class="wiz-panel" onclick="event.stopPropagation()">
      <div class="fb mb-m"><h3>Make Payment</h3><button data-action="close-modal" style="font-size:1.2rem;color:var(--ink-400)">&times;</button></div>
      <div class="card-flat mb-m" style="background:var(--accent-50)"><div class="txs tm">Amount Due</div><div class="tb" style="font-size:1.5rem;color:var(--accent-700)">$2,100.00</div></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div><label class="txs tb">Payment Amount</label><input type="text" value="2,100.00" style="width:100%;padding:8px 12px;border:1px solid var(--ink-200);border-radius:6px;margin-top:4px"></div>
        <div><label class="txs tb">Payment Method</label><select style="width:100%;padding:8px 12px;border:1px solid var(--ink-200);border-radius:6px;margin-top:4px"><option>ACH / Bank Transfer</option><option>Credit Card</option><option>Check</option></select></div>
        <button class="btn btn-primary" data-action="close-modal" style="width:100%;justify-content:center">Submit Payment (Demo)</button>
      </div>
      <div class="txs tm mt-m" style="text-align:center">This is a prototype. No actual payment will be processed.</div>
    </div></div>`;
  }
  else if(action==='close-modal'){$('wizard').innerHTML='';}
  else if(action==='wizard-open'){S.wizard={step:1,group:null,situation:null,approach:'pre-legal',form:{}};renderWizard();}
  else if(action==='wizard-close'||action==='wizard-close-bg'){S.wizard=null;renderWizard();}
  else if(action==='wizard-group'){S.wizard.group=el.dataset.group;renderWizard();}
  else if(action==='wizard-situation'){S.wizard.situation=el.dataset.sit;renderWizard();}
  else if(action==='wizard-approach'){S.wizard.approach=el.dataset.approach;renderWizard();}
  else if(action==='wizard-next'){
    if(S.wizard.step===1&&!S.wizard.group)return;
    if(S.wizard.step===2&&!S.wizard.situation)return;
    if(S.wizard.step===3&&!S.wizard.approach)return;
    S.wizard.step++;
    renderWizard();
  }
  else if(action==='wizard-back'){S.wizard.step--;renderWizard();}
  else if(action==='wizard-create'){
    const newId='C-'+(D.cases.length+1).toString().padStart(3,'0');
    const appr=D.caseApproaches.find(a=>a.id===S.wizard.approach);
    D.cases.push({id:newId,title:S.wizard.situation||'New Case',group:D.caseCategories.find(g=>g.id===S.wizard.group)?.label||'',priority:'medium',status:'Open',step:1,totalSteps:4,approach:appr?appr.label:'Pre-Legal',assignee:'Jane Smith'});
    S.wizard=null;
    S.tabs.cases='open';
    render();
  }
});

/* ===== ROLE SWITCH ===== */
document.addEventListener('change',e=>{
  if(e.target.id==='roleSwitcher'){
    S.role=e.target.value;
    S.view='today';
    S.caseDetail=null;
    render();
  }
});

/* ===== INIT ===== */
render();
</script>
</body>
</html>
