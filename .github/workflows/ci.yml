name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      # Production dependencies only: build and test tooling never ships to
      # the browser, and an unpatched advisory there would block every PR.
      - name: Audit (high severity, production dependencies)
        run: npm audit --omit=dev --audit-level=high
